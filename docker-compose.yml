# Local Firebase emulator suite for sveltekit-cloud-drive.
#
# The suite is pinned to the demo project `mock-drive-system` so rules evaluate
# against a disposable namespace: no production project id is required to run
# the app locally, and nothing here can reach real data.
#
#   docker compose up -d      # start the suite (UI on http://localhost:4000)
#   docker compose logs -f    # tail emulator output
#   docker compose down -v    # stop and wipe all emulator state

services:
  firebase-emulator:
    # Built from ./Dockerfile.emulator rather than pulled from a registry.
    #
    # The only published all-in-one image, `spine3/firebase-emulator`, pins
    # firebase-tools 9.17.0 (2021, Node 14). The Firestore web SDK this app
    # ships (firebase 12.x) authenticates its gRPC-web "webchannel" streams by
    # encoding the init message headers into the request *body* instead of the
    # `Authorization` header, specifically so the browser avoids a CORS
    # preflight. The 2021 Firestore emulator never learned to decode that
    # encoding, so every browser read and write reaches it anonymous and the
    # rules deny it with `permission-denied` at the first ownership check.
    #
    # Node clients are unaffected because they use the native gRPC transport,
    # which puts the token in ordinary gRPC metadata. That asymmetry is the
    # whole reason this looked like an application bug: `pnpm run verify` runs
    # in Node and passes, while the browser cannot read its own drive.
    build:
      context: .
      dockerfile: Dockerfile.emulator
    image: sveltekit-drive-emulators:modern
    container_name: sveltekit-drive-emulators
    restart: unless-stopped
    # Bind to every interface so the suite is reachable from a containerised
    # dev server or from a device on the LAN, not just from localhost.
    ports:
      - "0.0.0.0:4000:4000"   # Emulator UI
      - "0.0.0.0:8080:8080"   # Firestore
      - "0.0.0.0:9099:9099"   # Auth
      - "0.0.0.0:9199:9199"   # Storage
    volumes:
      - ./firebase.json:/firebase/firebase.json:ro
      # The CLI reads the project id from `.firebaserc`. Without it the Auth
      # emulator has no project and mints ID tokens with `aud: "change-me"`,
      # which the Firestore emulator rejects outright — so reads and writes
      # arrive anonymous and the rules deny them.
      - ./.firebaserc:/firebase/.firebaserc:ro
      - ./firestore.rules:/firebase/firestore.rules:ro
      - ./firestore.indexes.json:/firebase/firestore.indexes.json:ro
      - ./storage.rules:/firebase/storage.rules:ro
      # Persisted emulator state, so restarts keep seeded users and files.
      - firebase-emulator-state:/firebase/emulator-state
    environment:
      - FIREBASE_PROJECT=mock-drive-system
      - GCLOUD_PROJECT=mock-drive-system
      # The base image would otherwise default `GCP_PROJECT` to `change-me`,
      # and the CLI reads `GCP_PROJECT` in preference to both `GCLOUD_PROJECT`
      # and `.firebaserc`. Left alone, the Auth emulator mints ID tokens with
      # `aud: "change-me"` and Firestore rejects them — so a browser issues
      # every read and write anonymously and the rules deny it, while Node
      # clients are unaffected.
      - GCP_PROJECT=mock-drive-system
      # Accept logins from any origin; this suite is local-only by design.
      - FIREBASE_AUTH_EMULATOR_HOST=0.0.0.0:9099
      - FIREBASE_FIRESTORE_EMULATOR_HOST=0.0.0.0:8080
      - FIREBASE_STORAGE_EMULATOR_HOST=0.0.0.0:9199

volumes:
  firebase-emulator-state:
    driver: local
